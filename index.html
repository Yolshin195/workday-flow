<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity 50/10 Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .interval-card { transition: all 0.3s ease; border-left: 5px solid #dee2e6; }
        .interval-card.active-work { border-left-color: #0d6efd; background-color: #f0f7ff; }
        .interval-card.active-rest { border-left-color: #198754; background-color: #f0fff4; }
        .interval-card.completed { border-left-color: #6c757d; opacity: 0.8; }
        .timer-display { font-family: monospace; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>🚀 Трекер 50/10</h1>
        <div>
            <button class="btn btn-outline-primary btn-sm" onclick="exportData()"><i class="bi bi-download"></i> Экспорт JSON</button>
            <label class="btn btn-outline-secondary btn-sm mb-0">
                <i class="bi bi-upload"></i> Импорт <input type="file" id="importFile" hidden onchange="importData(event)">
            </label>
            <button class="btn btn-danger btn-sm" onclick="resetDay()"><i class="bi bi-trash"></i> Сброс</button>
        </div>
    </header>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">Параметры дня</h5>
                    <div class="mb-3">
                        <label class="form-label">Главная цель</label>
                        <textarea class="form-control" id="dailyGoal" rows="2" onchange="updateMetadata()"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Итоги дня</label>
                        <textarea class="form-control" id="dailySummary" rows="2" onchange="updateMetadata()"></textarea>
                    </div>
                </div>
            </div>
            
            <div id="activeStatusCard" class="card shadow-sm border-primary d-none">
                <div class="card-body text-center">
                    <h5 id="statusLabel">Работа...</h5>
                    <div class="timer-display mb-3" id="mainTimer">00:00</div>
                    <button class="btn btn-warning w-100" onclick="app.pause(); saveAndRender();">
                        <i class="bi bi-pause-fill"></i> Пауза
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div id="intervalsList">
                </div>
        </div>
    </div>
</div>

<script>
// --- КЛАСС ЛОГИКИ (Тот же, что мы обсуждали ранее) ---
class ProductivityApp {
    constructor(initialData = null) {
        this.state = initialData || this.createNewDay();
    }

    createNewDay() {
        const intervals = [];
        for (let i = 1; i <= 8; i++) {
            intervals.push({
                hour_index: i,
                status: "pending",
                planned_task: "",
                actual_result: "",
                work_segments: [],
                rest_segments: [],
                total_work_ms: 0,
                total_rest_ms: 0
            });
        }
        return {
            day_metadata: { date: new Date().toISOString().split('T')[0], daily_main_goal: "", daily_summary: "" },
            current_state: { active_hour_index: 0, mode: "idle", active_timer_start: null },
            work_intervals: intervals
        };
    }

    startWork(idx) {
        if (this.state.current_state.mode !== "idle") this.pause();
        this.state.current_state = { active_hour_index: idx, mode: "work", active_timer_start: new Date().toISOString() };
        this.state.work_intervals[idx-1].status = "in_progress";
    }

    startRest(idx) {
        if (this.state.current_state.mode !== "idle") this.pause();
        this.state.current_state = { active_hour_index: idx, mode: "rest", active_timer_start: new Date().toISOString() };
        this.state.work_intervals[idx-1].status = "resting";
    }

    pause() {
        const { mode, active_timer_start, active_hour_index } = this.state.current_state;
        if (!active_timer_start) return;

        const duration = new Date() - new Date(active_timer_start);
        const interval = this.state.work_intervals[active_hour_index - 1];

        const segment = { start: active_timer_start, end: new Date().toISOString(), duration_ms: duration };
        if (mode === "work") {
            interval.work_segments.push(segment);
            interval.total_work_ms += duration;
        } else {
            interval.rest_segments.push(segment);
            interval.total_rest_ms += duration;
        }

        this.state.current_state = { active_hour_index: 0, mode: "idle", active_timer_start: null };
    }

    complete(idx) {
        this.pause();
        this.state.work_intervals[idx-1].status = "completed";
    }
}

// --- ЛОГИКА ИНТЕРФЕЙСА ---
let app;
const STORAGE_KEY = 'productivity_state';

function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    app = new ProductivityApp(saved ? JSON.parse(saved) : null);
    
    // Восстановление метаданных в полях ввода
    document.getElementById('dailyGoal').value = app.state.day_metadata.daily_main_goal;
    document.getElementById('dailySummary').value = app.state.day_metadata.daily_summary;

    render();
    setInterval(updateTimerDisplay, 1000); // Обновление таймера каждую секунду
}

function render() {
    const list = document.getElementById('intervalsList');
    list.innerHTML = '';

    app.state.work_intervals.forEach((item, i) => {
        const idx = i + 1;
        const isActive = app.state.current_state.active_hour_index === idx;
        const mode = app.state.current_state.mode;
        
        let cardClass = "card mb-3 interval-card ";
        if (isActive) cardClass += (mode === 'work' ? 'active-work' : 'active-rest');
        if (item.status === 'completed') cardClass += 'completed';

        list.innerHTML += `
            <div class="${cardClass}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="mb-0">Час ${idx}</h5>
                        <span class="badge bg-secondary">${formatTime(item.total_work_ms)} / 50m</span>
                    </div>
                    
                    <input type="text" class="form-control form-control-sm mb-2" 
                           placeholder="Что планируем сделать?" 
                           value="${item.planned_task}" 
                           onchange="updateTask(${idx}, this.value)"
                           ${item.status === 'completed' ? 'disabled' : ''}>

                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-primary" onclick="startWork(${idx})" ${isActive && mode==='work' ? 'disabled' : ''}>
                            <i class="bi bi-play-fill"></i> Работа
                        </button>
                        <button class="btn btn-outline-success" onclick="startRest(${idx})" ${isActive && mode==='rest' ? 'disabled' : ''}>
                            <i class="bi bi-cup-hot"></i> Отдых
                        </button>
                        <button class="btn btn-outline-secondary" onclick="completeHour(${idx})">
                            <i class="bi bi-check-all"></i> Готово
                        </button>
                    </div>
                </div>
            </div>
        `;
    });
}

function updateTimerDisplay() {
    const state = app.state.current_state;
    const card = document.getElementById('activeStatusCard');
    
    if (state.mode === 'idle') {
        card.classList.add('d-none');
        return;
    }

    card.classList.remove('d-none');
    const diff = new Date() - new Date(state.active_timer_start);
    document.getElementById('mainTimer').innerText = formatTime(diff);
    document.getElementById('statusLabel').innerText = state.mode === 'work' ? '🔥 Работаем' : '☕ Отдых';
}

// Хелперы
function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const min = Math.floor(totalSec / 60).toString().padStart(2, '0');
    const sec = (totalSec % 60).toString().padStart(2, '0');
    return `${min}:${sec}`;
}

function saveAndRender() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(app.state));
    render();
}

// Экшны
function startWork(idx) { app.startWork(idx); saveAndRender(); }
function startRest(idx) { app.startRest(idx); saveAndRender(); }
function completeHour(idx) { app.complete(idx); saveAndRender(); }
function updateTask(idx, val) { app.state.work_intervals[idx-1].planned_task = val; saveAndRender(); }
function updateMetadata() {
    app.state.day_metadata.daily_main_goal = document.getElementById('dailyGoal').value;
    app.state.day_metadata.daily_summary = document.getElementById('dailySummary').value;
    saveAndRender();
}

function exportData() {
    const blob = new Blob([JSON.stringify(app.state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `productivity-${app.state.day_metadata.date}.json`;
    a.click();
}

function importData(event) {
    const reader = new FileReader();
    reader.onload = (e) => {
        app.state = JSON.parse(e.target.result);
        saveAndRender();
        location.reload(); 
    };
    reader.readAsText(event.target.files[0]);
}

function resetDay() {
    if(confirm('Очистить все данные за день?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

init();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
